# Optional monitoring stack for `node local-benchmark` (PHASE2-SPEC.md #8).
# Deliberate deviation from starfish's own docker-compose: starfish also dockerizes the
# node processes themselves (one `dry-run` container per authority); here the nodes run
# natively in one process (`node local-benchmark`), so this compose file brings up only
# the stock prometheus+grafana containers, reaching the native nodes' metrics endpoints
# via `host.docker.internal` (see the generated `<data-dir>/prometheus.yaml`).
#
# Usage (from the repository root, after starting `node local-benchmark` in another
# terminal so `.local-bench/prometheus.yaml` exists):
#   docker compose -f monitoring/docker-compose.yml up -d
# Grafana: http://localhost:3003 (anonymous admin, no login needed).
# Prometheus: http://localhost:9095
#
# Host ports 3003/9095 (not starfish's own 3002/9093): this machine's Docker Desktop
# already holds 3001/3002, and starfish's own local-dryrun compose collides with 9093.

services:
  prometheus:
    image: prom/prometheus
    ports:
      - "9095:9090"
    volumes:
      - ../.local-bench/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana
    ports:
      - "3003:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/main.yaml:ro
      - ./grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/main.yaml:ro
      - ./grafana/grafana-dashboard.json:/var/lib/grafana/dashboards/grafana-dashboard.json:ro
    restart: unless-stopped
