# Local benchmark configuration.

# Consensus protocol: vantage | autobahn-optimistic | autobahn-seamless
protocol: vantage

# Committee size and workers per authority.
nodes: 10
workers: 1

# Aggregate offered load across the committee.
rate: 1000          # tx/s
tx_size: 512        # bytes

# Transaction payload mode: all_zero | random.
mode: random

# Duration in seconds. 0 runs until Ctrl-C.
duration: 0

# Vantage AGB delay unit, in milliseconds.
delta_ms: 150

# Worker batch and primary header delays, in milliseconds.
max_batch_delay_ms: 20
max_header_delay_ms: 100

# Per-peer transport batching and flush limits.
batch_messages: true
batch_max_bytes: 65536
batch_max_delay_ms: 5

# Number of trailing nodes to leave unspawned; 0 means no crash.
crash: 0

# NxN RTT matrix in milliseconds, relative to the repository root.
# Use `none` for loopback.
latency_table: local-dryrun/latency/wan-rtt-10.csv
# latency_table: none

# Per-node stores and Prometheus target output directory.
data_dir: local-dryrun/data
