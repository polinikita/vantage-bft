[workspace]
members = ["primary", "node", "store", "crypto", "worker", "network", "config", "metrics"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/polinikita/vantage-bft"
rust-version = "1.95"
publish = false

[workspace.dependencies]
tokio = "1"
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.7"
bincode = "1.3"
bytes = "1"
futures = "0.3"
async-trait = "0.1"
async-recursion = "0.3"
rand = "0.8"
anyhow = "1.0"
clap = { version = "4", features = ["cargo"] }
base64 = "0.22"
blake3 = "1.5"
rocksdb = { version = "0.23", features = ["lz4", "zstd"] }
serial_test = "0.9"
prometheus = { version = "0.13", features = ["process"] }
parking_lot = "0.12"
libc = "0.2"
axum = "0.7"
fdlimit = "0.3"

# Post-quantum signature crates are ~10x slower unoptimized; keep them fast in
# dev/test builds.
[profile.dev.package.ml-dsa]
opt-level = 3
[profile.dev.package.slh-dsa]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
